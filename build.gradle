plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.24' // Check for new versions at https://plugins.gradle.org/plugin/io.papermc.paperweight.userdev
    id 'com.rikonardo.papermake' version '1.0.6'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'com.birdflop'
version = '1.0.4-SNAPSHOT'

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "sk89q"
        url = "https://maven.enginehub.org/repo/"
    }
}

dependencies {
    paperweight.paperDevBundle project.paper_version
    compileOnly "io.papermc.paper:paper-api:$paper_version"
    compileOnly "com.github.TechFortress:GriefPrevention:$griefprevention_version"
    compileOnly "com.sk89q.worldguard:worldguard-bukkit:$worldguard_version"
    implementation 'org.bstats:bstats-bukkit:3.0.0'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    def filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('') // ✅ Replace the default jar
    relocate 'org.bstats', 'com.birdflop.nerfstick.lib.bstats' // ✅ Avoid classpath conflicts
}

build.dependsOn shadowJar // ✅ Ensure shadowed JAR is built by default

tasks.named('papermakeFinalizeBuild') {
    enabled = false
}